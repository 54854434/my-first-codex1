<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a1b"><title>孤军：重生战役</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="field" aria-label="自由移动战场，点击地面前往"></canvas>
<div id="hud" hidden>
 <div class="hero-hud"><div class="hero-head"><span class="commander-mark">✦</span><b>指挥官 <em id="level">Lv.1</em></b><button id="pause" aria-label="暂停与设置">Ⅱ</button></div><div class="health"><i id="healthFill"></i><span id="healthText">140 / 140</span></div><div class="experience"><i id="xpFill"></i></div><div class="hero-foot"><span id="life">首次出击</span><span id="clock">00:00</span></div></div>
 <div class="operation-hud"><div class="resources"><div><small>补给</small><b id="supply">90</b></div><div><small>兵力</small><b id="army">0 / 7</b></div><div><small>占领</small><b id="captured">0 / 10</b></div></div><div class="order-bar"><button id="follow" class="active">跟随</button><button id="hold">驻守</button><button id="attack">派兵攻点</button></div><span id="income">据点收入 +0 / 秒</span></div>
 <button id="mapButton" aria-label="打开战术地图"><span><i class="signal-dot"></i>战区 <b id="sector">01</b><em>战术地图 ↗</em></span><canvas id="minimap"></canvas></button>
 <button id="objective"><span>当前目标 / OBJECTIVE</span><b id="objectiveText">夺取鸦巢哨站</b><small id="objectiveSub">占领 3 处据点，解除敌军总部护盾</small></button>
 <div id="joystick"><div class="joy-ring"></div><div id="knob"></div><small>移动 / MOVE</small></div>
 <div class="skills"><div class="skill-row"><button id="rally" class="skill" aria-label="集结与治疗"><span data-icon="cross"></span><b>集结治疗</b><em></em></button><button id="air" class="skill" aria-label="呼叫空袭"><span data-icon="air"></span><b>空袭</b><em></em></button><button id="grenade" class="skill" aria-label="投掷手雷"><span data-icon="grenade"></span><b>手雷</b><em></em></button></div><div class="skill-row"><button id="recruit" class="recruit"><span data-icon="army"></span><b>招募部队</b><small>军队编组</small></button><button id="dash" class="dash" aria-label="战术闪避"><span data-icon="boot"></span><b>闪避</b><em></em></button></div></div>
 <div id="hint">摇杆移动 · 自动射击 · 点击地面前往</div><div id="bossWarning" hidden>⚠ 攻城战车进入战场</div>
</div>
<div id="toasts" aria-live="polite"></div><div id="modal" class="modal" hidden><section id="modalCard" class="modal-card"></section></div>
<script src="spatial-hash.js"></script><script src="steering.js"></script><script src="engine.js"></script><script src="input.js"></script><script src="renderer.js"></script><script src="game.js"></script>
</body></html>
