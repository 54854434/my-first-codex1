<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101512"><title>孤军：无限战线</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game">
<header><div class="brand"><span class="insignia">❖</span><div><b>孤军<span>无限战线</span></b><small>LONE FRONTIER / FIELD COMMAND</small></div></div><button id="menu" class="iconbtn" aria-label="暂停与设置">Ⅱ</button></header>
<section class="resources"><div><small>战地补给</small><b id="credits">35</b><span>SUPPLY</span></div><div><small>全队秒伤</small><b id="dps">10</b><span>FIREPOWER</span></div><div><small>荣誉勋章</small><b id="medals">0</b><span>HONOR</span></div></section>
<section class="battle-shell"><div class="wavebar"><div><span class="live-dot"></span><b id="wave">第 01 波</b><small id="sector">灰烬荒原</small></div><span id="enemyCount">等待部署</span></div><div class="hpbar"><div id="hpFill"></div><span id="hpLabel">防线耐久 160 / 160</span></div><div class="canvas-wrap"><canvas id="battle" aria-label="战场，点击敌人集中火力"></canvas><div class="map-coord">SECTOR 07 // 34°N</div><div class="battle-badge" id="battleBadge">等待指令</div><div class="battle-bottom"><span>◈ <b id="unitCount">01</b> 作战单位</span><span id="best">最高记录 0</span></div></div><div id="status" class="status"><span id="statusText">你的第一名步兵已就位。</span><button id="deploy">开始战斗 <span>→</span></button></div></section>
<section class="skills"><button id="grenade" class="skill"><span class="skill-icon" data-icon="grenade"></span><span><b>破片手雷</b><small>范围打击 · 13s</small></span><em></em></button><button id="air" class="skill"><span class="skill-icon" data-icon="air"></span><span><b>空中支援</b><small>第 5 波解锁</small></span><em></em></button><button id="repair" class="skill"><span class="skill-icon" data-icon="repair"></span><span><b>紧急维修</b><small>恢复 35% · 32s</small></span><em></em></button></section>
<section class="command"><div class="command-title"><div><small>FIELD OPERATIONS</small><h2>战地指挥部</h2></div><button id="speed" class="chip">速度 ×1</button><button id="auto" class="chip">自动升级</button></div><nav class="tabs"><button class="selected" data-tab="arms">军备升级</button><button data-tab="squad">招募部队 <span id="squadDot"></span></button><button data-tab="tech">永久科技</button></nav><div id="upgradeList" class="upgrades"></div><div id="techNote" hidden class="tech-note">第 10 波后可撤离重编，获得勋章。永久科技会保留到下一次作战。<button id="prestige">撤离重编</button></div></section>
<footer><span>自动存档 <i id="saveDot"></i></span><span id="footerHint">点击战场集火 · 长按升级连续购买</span></footer>
</main><div id="toasts" aria-live="polite"></div><div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<script src="engine.js"></script><script src="game.js"></script></body></html>
