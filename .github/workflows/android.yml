name: Android APK
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y swig ninja-build openvpn
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Test public feed parser and configuration boundary
        run: bash scripts/test.sh
      - name: Check live public source from the build network
        continue-on-error: true
        run: java -cp .checks com.aurora.vpn.GateLiveCheck
      - name: Bundle a fresh dated public node snapshot
        run: java -cp .checks com.aurora.vpn.GateSeedBuilder overlay/assets/gate-seed.csv
      - name: Test real public OpenVPN handshakes from CI (no routes)
        run: python3 scripts/check_handshakes.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-handshake-report
          path: .checks/handshakes/report.json
      - name: Apply Aurora UI to pinned engine
        run: python3 scripts/prepare.py
      - name: Build integrated APK
        run: bash upstream/gradlew -p upstream :main:compileUiOvpn2DebugJavaWithJavac :main:assembleUiOvpn2Debug :main:assembleUiOvpn2DebugAndroidTest --stacktrace
      - name: Verify snapshot inside the final APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          apks=list(Path('upstream/main/build/outputs/apk').glob('**/debug/*.apk'))
          apks=[apk for apk in apks if 'androidTest' not in apk.parts]
          assert apks, 'No APK produced'
          for apk in apks:
              subprocess.run(['java','-cp','.checks','com.aurora.vpn.ApkSeedCheck',str(apk)],check=True)
          PY
      - name: Check lint against reviewed upstream baseline
        run: bash upstream/gradlew -p upstream :main:lintUiOvpn2Debug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: upstream/main/build/reports/
          if-no-files-found: ignore
      - name: Enable KVM for actual Android runtime test
        run: sudo chmod 666 /dev/kvm
      - name: Install APK and test real VPN egress on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash scripts/android_connection_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-actual-connection-proof
          path: .checks/android-proof/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-free-vpn-debug
          path: upstream/main/build/outputs/apk/uiOvpn2/debug/*.apk
          if-no-files-found: error
          retention-days: 14
