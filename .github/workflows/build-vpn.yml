name: Build NodeAtlas VPN

on:
  push:
    branches:
      - codex/node-atlas-vpn
  workflow_dispatch:

concurrency:
  group: nodeatlas-vpn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NodeAtlas overlay
        uses: actions/checkout@v4

      - name: Checkout sing-box Android client
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: bc73504fcb858400a939140ad785ed92f4c9f429
          path: sing-box-for-android
          fetch-depth: 1

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: dfb80349bf5779ec0a3f834c9ec2794345bff8f0
          path: sing-box
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Ensure the exact sing-box NDK is selected
        run: |
          sdkmanager_path="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_path" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install gomobile toolchain
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13

      - name: Restore libbox AAR cache
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: sing-box-for-android/app/libs
          key: nodeatlas-libbox-${{ runner.os }}-dfb80349-ndk28-go1.26.8

      - name: Build libbox AARs
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          mkdir -p ../sing-box-for-android/app/libs
          go run ./cmd/internal/build_libbox

      - name: Verify libbox AARs
        shell: bash
        run: |
          set -euo pipefail
          test -s sing-box-for-android/app/libs/libbox.aar
          test -s sing-box-for-android/app/libs/libbox-legacy.aar

      - name: Overlay NodeAtlas discovery UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sing-box-for-android/app/src/main/assets
          cp app/src/main/assets/index.html sing-box-for-android/app/src/main/assets/nodeatlas.html
          mkdir -p sing-box-for-android/app/src/main/java/io/nekohasekai/sfa/nodeatlas
          cp vpn-overlay/NodeAtlasActivity.java sing-box-for-android/app/src/main/java/io/nekohasekai/sfa/nodeatlas/NodeAtlasActivity.java
          cp vpn-overlay/NodeAtlasController.kt sing-box-for-android/app/src/main/java/io/nekohasekai/sfa/nodeatlas/NodeAtlasController.kt
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("sing-box-for-android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          anchor_match = re.search(r'(?m)^[ \t]*<activity\s+android:name="\.compose\.MainActivity"', text)
          if not anchor_match:
              raise SystemExit("SFA MainActivity anchor was not found")
          start = anchor_match.start()
          end = text.find("</activity>", start)
          if end < 0:
              raise SystemExit("SFA MainActivity closing tag was not found")
          block = text[start:end]
          block, removed = re.subn(r'\s*<intent-filter>\s*<action android:name="android.intent.action.MAIN" />\s*<category android:name="android.intent.category.LAUNCHER" />\s*</intent-filter>', "", block, count=1)
          if removed != 1:
              raise SystemExit("SFA launcher block was not found")
          text = text[:start] + block + text[end:]
          node_atlas = '''        <activity
            android:name=".nodeatlas.NodeAtlasActivity"
            android:exported="true"
            android:screenOrientation="portrait"
            android:theme="@style/AppTheme">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
          </activity>
          '''
          text = text[:start] + node_atlas + text[start:]
          manifest.write_text(text)

          strings = Path("sing-box-for-android/app/src/main/res/values/strings.xml")
          string_text = strings.read_text()
          old = '<string name="app_name" translatable="false">sing-box</string>'
          if old not in string_text:
              raise SystemExit("SFA app_name was not found")
          strings.write_text(string_text.replace(old, '<string name="app_name" translatable="false">NodeAtlas</string>', 1))

          # Deliver a compact modern-device APK. The upstream project normally
          # emits a universal APK plus four ABI splits; the release artifact is
          # intentionally arm64-v8a only to avoid shipping unused native cores.
          build_file = Path("sing-box-for-android/app/build.gradle.kts")
          build_text = build_file.read_text()
          # The NodeAtlas launcher replaces the upstream Compose dashboard with a
          # WebView surface. Keep the VPN service and data layer, but let R8 remove
          # the unreachable upstream screens and their resources from the debug APK.
          build_text, debug_changed = re.subn(
              r'(?m)^    debug\s*\{\s*',
              '''    debug {
            isMinifyEnabled = true
            isShrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            ''',
              build_text,
              count=1,
          )
          if debug_changed != 1:
              raise SystemExit("Could not enable R8 shrinking for the NodeAtlas debug APK")
          build_text, universal_changed = re.subn(
              r'(?m)^(\s*isUniversalApk\s*=\s*)true\s*$',
              r'\1false',
              build_text,
              count=1,
          )
          build_text, abi_changed = re.subn(
              r'include\(\s*"armeabi-v7a"\s*,\s*"arm64-v8a"\s*,\s*"x86"\s*,\s*"x86_64"\s*\)',
              'include("arm64-v8a")',
              build_text,
              count=1,
          )
          if universal_changed != 1 or abi_changed != 1:
              raise SystemExit("Could not apply arm64-only APK packaging overlay")
          build_text, jni_changed = re.subn(
              r'(?s)(packaging\s*\{\s*jniLibs\s*\{\s*useLegacyPackaging\s*=\s*true)',
              r'''\1
            // NodeAtlas launches a WebView surface and does not use the upstream terminal,
            // camera barcode scanner, or JSON editor native libraries.
            excludes += setOf(
                "**/libghostty_android.so",
                "**/libandroid-tree-sitter.so",
                "**/libtree-sitter-json.so",
                "**/libimage_processing_util_jni.so",
            )''',
              build_text,
              count=1,
          )
          if jni_changed != 1:
              raise SystemExit("Could not apply unused JNI packaging overlay")
          build_file.write_text(build_text)
          PY

      - name: Build NodeAtlas VPN APK
        working-directory: sing-box-for-android
        run: ./gradlew --no-daemon --stacktrace :app:assembleOtherDebug

      - name: Assemble deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find sing-box-for-android/app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          printf 'Generated APKs:\n%s\n' "${apks[*]}"
          apk=$(printf '%s\n' "${apks[@]}" | grep -E '/[^/]*arm64-v8a[^/]*\.apk$' | head -n 1 || true)
          if [ -z "$apk" ]; then
            apk=$(printf '%s\n' "${apks[@]}" | grep -E '/[^/]*universal[^/]*\.apk$' | head -n 1 || true)
          fi
          if [ -z "$apk" ]; then
            apk="${apks[0]}"
          fi
          cp "$apk" dist/NodeAtlas-VPN-debug.apk
          cp app/src/main/assets/index.html dist/NodeAtlas-VPN.html
          cat > dist/SOURCE-NOTICES.txt <<'EOF'
          NodeAtlas VPN build

          This APK combines the NodeAtlas discovery UI with the SagerNet sing-box-for-android client and sing-box core.
          The upstream Android client and core are GPL-3.0-or-later; see the upstream repositories for complete source and license text:
          https://github.com/SagerNet/sing-box-for-android
          https://github.com/SagerNet/sing-box

          NodeAtlas public-source discovery is intentionally untrusted. It only parses public HTTPS text feeds and labels risk;
          it does not certify speed, ownership, legality, or privacy of any node.
          EOF
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload APK and HTML
        uses: actions/upload-artifact@v4
        with:
          name: nodeatlas-vpn-build
          path: dist
          if-no-files-found: error

      - name: Publish public GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nodeatlas-latest"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/NodeAtlas-VPN-debug.apk \
              dist/NodeAtlas-VPN.html \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" \
              dist/NodeAtlas-VPN-debug.apk \
              dist/NodeAtlas-VPN.html \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NodeAtlas latest" \
              --notes "Latest NodeAtlas VPN APK and standalone web page. Public-source nodes are untrusted and may expire."
          fi
