name: Public source compatibility audit
on:
  push:
    branches: ['research/free-node-sources']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-audit
          path: .checks/source-audit/
          retention-days: 7
