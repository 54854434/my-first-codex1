name: Lone Frontier Rebirth APK
on:
  push:
    branches: ['codex/lone-frontier-android']
    paths: ['lone-frontier/**', '.github/workflows/lone-frontier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compilation tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify signed APK
        run: bash lone-frontier/scripts/build.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and play on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: python3 lone-frontier/scripts/android-smoke.py
      - name: Preserve APK and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoneFrontier-Rebirth-Android
          path: lone-frontier/dist/
          retention-days: 30
